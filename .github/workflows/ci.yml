name: CapitalFlow CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-and-domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm install
      - name: Run domain, Edge parser, and Android parser tests
        run: npm run test:all
      - name: Type-check workspaces
        run: npm run typecheck
      - name: Build production PWA
        run: npm run build
